# Prometheus scrape config for local development. The job targets the API on the
# host, so it works whether the service runs via `make run` or compose.
#
# This file is a TEMPLATE: docker compose expands __METRICS_TOKEN__ at start,
# because Prometheus v3 dropped the expand-env feature flag.
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    env: local

rule_files:
  - /etc/prometheus-template/alert.rules.yml

scrape_configs:
  - job_name: golang-base
    metrics_path: /metrics
    scheme: __SCRAPE_SCHEME__
    # The endpoint is token-guarded. METRICS_TOKEN must equal the value the API
    # process runs with; an unauthenticated scrape just yields 401 series-free.
    authorization:
      type: Bearer
      credentials: __METRICS_TOKEN__
    static_configs:
      - targets:
          - __SCRAPE_TARGET__
        labels:
          instance: __SCRAPE_TARGET__

  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090
