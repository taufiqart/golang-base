name: Build & Deploy Production

on:
  push:
    branches: [prod]

env:
  IMAGE_NAME: golang-base
  COMPOSE_IMAGE_NAME: golang-base
  REGISTRY: ${{ secrets.PROD_REGISTRY || 'localhost:5100' }}
  REGISTRY_PORT: ${{ secrets.PROD_REGISTRY_PORT || '5100' }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container
          driver-opts: network=host

      - name: Set image tag
        id: vars
        run: |
          echo "TAG=$(echo $GITHUB_SHA | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PROD_SERVER_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.PROD_SERVER_HOST }} >> ~/.ssh/known_hosts

      - name: Open SSH tunnel to local registry
        run: |
          ssh -fNL ${{ env.REGISTRY_PORT }}:localhost:${{ env.REGISTRY_PORT }} \
            -i ~/.ssh/deploy_key \
            ${{ secrets.PROD_SERVER_USER }}@${{ secrets.PROD_SERVER_HOST }}

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile

          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.TAG }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

          push: true

          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Close SSH tunnel
        if: always()
        run: pkill ssh || true

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PROD_SERVER_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: SSH Deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PROD_SERVER_HOST }}
          username: ${{ secrets.PROD_SERVER_USER }}
          key: ${{ secrets.PROD_SERVER_SSH_KEY }}
          script: |
            set -e
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            cd ${{ secrets.PROD_SERVER_PATH }}

            mkdir -p ./backups/database
            docker compose -f docker-compose.server.yml exec -T postgres pg_dump -U postgres golang_base | gzip > ./backups/database/golang_base-$(date +%Y%m%d%H%M%S).sql.gz

            docker compose -f docker-compose.server.yml up -d --no-build

            docker compose -f docker-compose.server.yml exec -T api ./migrate up

            # Keep the 2 latest images (latest and 1 previous version) for rollback
            # and STRICTLY ensure we only delete images matching the specified IMAGE_NAME
            IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
            docker image ls -q $IMAGE | uniq | tail -n +4 | xargs -r docker rmi -f
